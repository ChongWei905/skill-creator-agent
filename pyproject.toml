[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-creator-agent"
version = "0.1.0"
description = "Standalone knowledge skills runtime extracted from Ferry."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
skill-creator-chat = "knowledge_skills.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_skills*", "connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
