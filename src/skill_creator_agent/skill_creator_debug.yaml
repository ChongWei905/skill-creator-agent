AGENT_CONFIG:
  name: "skill_creator_debug"
  backend: "langgraph"
  type: "react"
  agent_type: "skill_creator"
  debug: true

MODEL:
  skill_creator_chat:
    provider: "openai"
    model_type: "chat"
    params:
      model: "debug-chat-model"
      api_key: "test-key"

SKILL_CREATOR:
  skills_root: "fixtures/minimal_skills"
  graph_enabled: true
  graph_base_url: "http://127.0.0.1:8000"
  graph_timeout: 30

TOOLS:
  local_functions:
    - name: "bash"
      function: "bash"
      module: "ferry.actions.tools.local_tool.tools"
    - name: "read_file"
      function: "read_file"
      module: "ferry.actions.tools.local_tool.tools"
    - name: "write_file"
      function: "write_file"
      module: "ferry.actions.tools.local_tool.tools"
    - name: "apply_patch"
      function: "apply_patch"
      module: "ferry.actions.tools.local_tool.tools"
  skills:
    - name: "skill-creator-smoke"
      path: "fixtures/minimal_skills/skill-creator-smoke"
      category: "workflow"
      description: "Minimal fixture skill used to validate skill_creator migration wiring."
      tags: ["skill-creator", "smoke"]
